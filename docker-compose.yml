name: proyecto1-supermercado

services:
  mongodb:
    image: mongo:8.0
    container_name: mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:?Falta MONGO_DATABASE en .env}
    volumes:
      - mongo_data:/data/db
    networks:
      proyecto_network:
        ipv4_address: 192.168.162.15
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "quit(db.adminCommand({ping: 1}).ok ? 0 : 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build: ./backend
    image: proyecto1-backend:1.0
    container_name: proyecto1-backend
    restart: unless-stopped
    environment:
      MONGO_HOST: ${MONGO_HOST:?Falta MONGO_HOST en .env}
      MONGO_PORT: "${MONGO_PORT:?Falta MONGO_PORT en .env}"
      MONGO_DATABASE: ${MONGO_DATABASE:?Falta MONGO_DATABASE en .env}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      proyecto_network:
        ipv4_address: 192.168.162.14
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/productos', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build: ./frontend
    image: proyecto1-frontend:1.0
    container_name: proyecto1-frontend
    restart: unless-stopped
    networks:
      proyecto_network:
        ipv4_address: 192.168.162.13

  gateway:
    image: nginx:alpine
    container_name: proyecto1-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:80"
      - "127.0.0.1:8443:443"
    volumes:
      - type: bind
        source: ./nginx/nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./nginx/certs
        target: /etc/nginx/certs
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      proyecto_network:
        ipv4_address: 192.168.162.12

networks:
  proyecto_network:
    external: true
    name: proyecto_network

volumes:
  mongo_data:
    external: true
    name: proyecto1_mongo_data